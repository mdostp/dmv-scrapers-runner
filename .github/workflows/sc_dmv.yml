name: SC DMV Scraper

on:
  schedule:
    # All times UTC — Eastern is UTC-5 (EST) or UTC-4 (EDT)
    # Assuming EST (UTC-5), which applies Nov–Mar
    # When DST starts (2nd Sunday in March), subtract 1 from each UTC hour
    - cron: '5 14 * * 1-5'    #  9:05 AM Eastern
    - cron: '30 14 * * 1-5'   #  9:30 AM Eastern
    - cron: '0 16 * * 1-5'    # 11:00 AM Eastern
    - cron: '30 17 * * 1-5'   # 12:30 PM Eastern
    - cron: '0 19 * * 1-5'    #  2:00 PM Eastern
    - cron: '30 20 * * 1-5'   #  3:30 PM Eastern
    - cron: '15 21 * * 1-5'   #  4:15 PM Eastern
    - cron: '45 21 * * 1-5'   #  4:45 PM Eastern
  workflow_dispatch:

jobs:
  call-scraper:
    uses: ./.github/workflows/_scraper-template.yml
    with:
      target_repo: mdostp/multistate-scrapers
      python_version: '3.11'
      pip_packages: 'requests pandas beautifulsoup4'
      run_commands: |
        python SC_queue_scraper.py --once
      commit_paths: '*.csv'
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
